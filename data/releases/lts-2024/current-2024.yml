    \n\r\n #### Changes:\r\n  - The system CA bundle now only contains roots that\
    \ Mozilla trusts for TLS. The 49 roots that Mozilla trusts only for S/MIME (email)\
    \ were removed from `/etc/ssl/certs` and `ca-certificates.crt`, reducing the bundle\
    \ from 167 to 118 roots. ([scripts#4333](https://github.com/flatcar/scripts/pull/4333))\r\
    \n \r\n #### Updates:\r\n \r\n - Linux ([6.6.160](https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/tag/?h=v6.6.160))\r\
