    \n \r\n #### Bug fixes:\r\n \r\n - AWS arm64: Removed bare `earlycon` from the\
    \ kernel command line. It took the UART address from the ACPI SPCR table, which\
    \ is wrong on Graviton, and could hang boot when an NVMe device was mapped at\
    \ that address, e.g. on t4g instances with an additional EBS volume. ([Flatcar#2446](https://github.com/flatcar/Flatcar/issues/2446))\r\
    \n - STACKIT: Masked `systemd-timesyncd.service` in the OEM sysext. It conflicts\
    \ with `chronyd.service`, and which of the two ended up running after boot depended\
    \ on timing. ([scripts#4318](https://github.com/flatcar/scripts/pull/4318))\r\n\
    \ \r\n #### Updates:\r\n \r\n - Go ([1.26.10](https://go.dev/doc/devel/release#go1.26.10)\
    \ (includes [1.26.4](https://go.dev/doc/devel/release#go1.26.4), [1.26.5](https://go.dev/doc/devel/release#go1.26.5),\
