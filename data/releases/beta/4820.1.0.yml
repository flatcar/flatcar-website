    \n \r\n #### Bug fixes:\r\n \r\n - AWS arm64: Removed bare `earlycon` from the\
    \ kernel command line. It took the UART address from the ACPI SPCR table, which\
    \ is wrong on Graviton, and could hang boot when an NVMe device was mapped at\
    \ that address, e.g. on t4g instances with an additional EBS volume. ([Flatcar#2446](https://github.com/flatcar/Flatcar/issues/2446))\r\
    \n - Fixed swtpm process cleanup in QEMU launcher on macOS by using POSIX kill\
    \ -0 instead of checking Linux-only /proc.\r\n - Improved early boot `ip=` kernel\
    \ command line handling by dropping Flatcar's custom parser in favour of systemd-network-generator.\
    \ IPv6 and VLANs should work better, and it will no longer assign the given IP\
    \ address to the loopback interface if you don't specify the device name. If you\
    \ used `dhcp,dhcp6` for a dual stack configuration, you should now specify `any`\
    \ instead. ([Flatcar#1708](https://github.com/flatcar/Flatcar/issues/1708), [Flatcar#1894](https://github.com/flatcar/Flatcar/issues/1894),\
    \ [Flatcar#2002](https://github.com/flatcar/Flatcar/issues/2002))\r\n - STACKIT:\
    \ Masked `systemd-timesyncd.service` in the OEM sysext. It conflicts with `chronyd.service`,\
    \ and which of the two ended up running after boot depended on timing. ([scripts#4318](https://github.com/flatcar/scripts/pull/4318))\r\
    \n \r\n #### Changes:\r\n \r\n - Removed the `net-misc/bridge-utils` package.\
    \ It is deprecated upstream in favor of the `bridge` utility from iproute2, which\
    \ Flatcar ships through `sys-apps/iproute2`. Use `ip link add ... type bridge`\
    \ instead of `brctl addbr ...`. ([Flatcar#638](https://github.com/flatcar/Flatcar/issues/638))\r\
