    \n \r\n #### Bug fixes:\r\n \r\n - Fixed SELinux labelling of the confexts and\
    \ system dependent sysexts. These were previously labelled entirely with `container_file_t`.\
    \ ([scripts#4385](https://github.com/flatcar/scripts/pull/4385))\r\n \r\n ####\
    \ Changes:\r\n \r\n - Added Outscale images ([Flatcar#2334](https://github.com/flatcar/Flatcar/issues/2334))\r\
    \n - Enabled PCIe Precision Time Measurement (`CONFIG_PCIE_PTM`) in the kernel.\
    \ NICs that support it, such as Intel I226 with `igc`, now give `phc2sys` and\
    \ `chrony` precise PHC readings through `PTP_SYS_OFFSET_PRECISE`. ([Flatcar#2457](https://github.com/flatcar/Flatcar/issues/2457))\r\
    \n - SDK: The .env and .sdkenv files are no longer used to pass environment variables\
    \ into the SDK container as this is insecure. Use run_sdk_container's new -e option\
    \ instead.\r\n - Switched from shadow's su implementation to util-linux's, as\
    \ the former is deprecated upstream.\r\n \r\n #### Updates:\r\n\r\n\r\n - Linux\
