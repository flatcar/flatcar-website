    \n\r\n#### Bug fixes:\r\n\r\n- AWS arm64: Removed bare `earlycon` from the kernel\
    \ command line. It took the UART address from the ACPI SPCR table, which is wrong\
    \ on Graviton, and could hang boot when an NVMe device was mapped at that address,\
    \ e.g. on t4g instances with an additional EBS volume. ([Flatcar#2446](https://github.com/flatcar/Flatcar/issues/2446))\r\
    \n- Alpha and Beta only: Fixed SSH client that was broken by a configuration file\
    \ with bad permissions being unreadable. ([scripts#4338](https://github.com/flatcar/scripts/pull/4338))\r\
    \n- STACKIT: Masked `systemd-timesyncd.service` in the OEM sysext. It conflicts\
    \ with `chronyd.service`, and which of the two ended up running after boot depended\
    \ on timing. ([scripts#4318](https://github.com/flatcar/scripts/pull/4318))\r\n\
    \r\n#### Changes:\r\n\r\n- Provided NVIDIA 580 (LTS branch) driver sysexts as\
    \ `nvidia-drivers-580` and `nvidia-drivers-580-open`. Write the name to `/etc/flatcar/enabled-sysext.conf`\
    \ through Ignition to use them. The 535, 550 and 570 branches are end-of-life\
    \ upstream; switching to 580 is recommended.\r\n- The system CA bundle now only\
    \ contains roots that Mozilla trusts for TLS. The 49 roots that Mozilla trusts\
    \ only for S/MIME (email) were removed from `/etc/ssl/certs` and `ca-certificates.crt`,\
    \ reducing the bundle from 167 to 118 roots. ([scripts#4333](https://github.com/flatcar/scripts/pull/4333))\r\
