    \n \r\n #### Bug fixes:\r\n \r\n - Fixed swtpm process cleanup in QEMU launcher\
    \ on macOS by using POSIX kill -0 instead of checking Linux-only /proc.\r\n -\
    \ Improved early boot `ip=` kernel command line handling by dropping Flatcar's\
    \ custom parser in favour of systemd-network-generator. IPv6 and VLANs should\
    \ work better, and it will no longer assign the given IP address to the loopback\
    \ interface if you don't specify the device name. If you used `dhcp,dhcp6` for\
    \ a dual stack configuration, you should now specify `any` instead. ([Flatcar#1708](https://github.com/flatcar/Flatcar/issues/1708),\
    \ [Flatcar#1894](https://github.com/flatcar/Flatcar/issues/1894), [Flatcar#2002](https://github.com/flatcar/Flatcar/issues/2002))\r\
    \n \r\n #### Changes:\r\n \r\n - Removed the `net-misc/bridge-utils` package.\
    \ It is deprecated upstream in favor of the `bridge` utility from iproute2, which\
    \ Flatcar ships through `sys-apps/iproute2`. Use `ip link add ... type bridge`\
    \ instead of `brctl addbr ...`. ([Flatcar#638](https://github.com/flatcar/Flatcar/issues/638))\r\
